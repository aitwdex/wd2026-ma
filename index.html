<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>東海エリア リアルタイム天気</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container my-5">
    <h1 class="mb-4">東海エリア リアルタイム天気</h1>
    
    <div class="row">
      
      <div class="col-md-6 mb-4">
        <div class="d-flex gap-2">
          <select id="citySelect" class="form-select" style="max-width: 200px;">
            <option value="35.06,136.68">桑名市</option>
            <option value="35.08,137.15">豊田市</option>
            <option value="35.18,136.91">名古屋市</option>
          </select>
          <button id="getBtn" class="btn btn-primary flex-shrink-0">天気を取得</button>
        </div>
      </div>

      <div class="col-md-6">
        <div id="resultCard" class="card shadow-sm weather-card">
          <div class="card-body">
            <h5 id="cityName" class="card-title text-primary">都市名</h5>
            <h6 id="weatherDesc" class="card-subtitle mb-3 text-muted">天気</h6>
            <h2 id="temp" class="card-text mb-2">-- ℃</h2>
            <p id="wind" class="card-text text-secondary mb-0">風速: -- km/h</p>
          </div>
        </div>
      </div>

    </div> </div>

  <footer class="container text-center mt-5 pb-4">
    <small class="text-muted">Weather data by <a href="https://open-meteo.com/" target="_blank">Open-Meteo.com</a>（CC BY 4.0）</small>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
