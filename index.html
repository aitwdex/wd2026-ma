<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>東海エリア リアルタイム天気</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .weather-card { display: none;}
  </style>
</head>
<body>
  <div class="container my-5">
    <h1 class="mb-4">東海エリア リアルタイム天気</h1>
    
    <div class="row mb-3">
      <div class="col-auto">
        <select id="citySelect" class="form-select">
          <option value="35.06,136.68">桑名市</option>
          <option value="35.08,137.15">豊田市</option>
          <option value="35.18,136.91">名古屋市</option>
        </select>
      </div>
      <div class="col-auto">
        <button id="getBtn" class="btn btn-primary">天気を取得</button>
      </div>
    </div>

    <div id="resultCard" class="card shadow-sm weather-card" style="width: 22rem;">
      <div class="card-body">
        <h5 id="cityName" class="card-title text-primary">都市名</h5>
        <h6 id="weatherDesc" class="card-subtitle mb-3 text-muted">天気</h6>
        <h2 id="temp" class="card-text mb-2">-- ℃</h2>
        <p id="wind" class="card-text text-secondary mb-0">風速: -- km/h</p>
      </div>
    </div>
  </div>

  <footer class="container text-center mt-5 pb-4">
    <small class="text-muted">Weather data by <a href="https://open-meteo.com/" target="_blank">Open-Meteo.com</a>（CC BY 4.0）</small>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
